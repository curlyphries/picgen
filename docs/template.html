<title>picgen studio docs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: product manual. Sticky contents rail left, one ~70ch reading column, API endpoints as compact ruled blocks. */
:root{
  --bg:#f5f6f9; --surface:#ffffff; --sunk:#eceff5; --fg:#161a22; --muted:#596173; --line:#dde1ea;
  --accent:#2f6fe4; --accent-soft:#e3ecfd; --violet:#7b4fe0;
  --get:#1f7a4d; --post:#2f6fe4; --patch:#9a6412; --delete:#b3392b;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --radius:10px; --rail:270px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1115; --surface:#171a21; --sunk:#12151b; --fg:#e8e8ea; --muted:#8f95a6; --line:#262b36;
  --accent:#6b9dff; --accent-soft:#1a2540; --violet:#a07cff;
  --get:#4cc38a; --post:#6b9dff; --patch:#e0a43a; --delete:#ff7a6b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1115; --surface:#171a21; --sunk:#12151b; --fg:#e8e8ea; --muted:#8f95a6; --line:#262b36;
  --accent:#6b9dff; --accent-soft:#1a2540; --violet:#a07cff;
  --get:#4cc38a; --post:#6b9dff; --patch:#e0a43a; --delete:#ff7a6b; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--fg);font:15.5px/1.65 var(--ui);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-underline-offset:2px}
a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
code,pre{font-family:var(--mono);font-size:.86em}
:not(pre)>code{background:var(--sunk);border:1px solid var(--line);padding:.05em .35em;border-radius:5px;overflow-wrap:anywhere}
pre{background:var(--sunk);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;overflow-x:auto;line-height:1.5;margin:14px 0}
pre code{font-size:13px}

.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);gap:48px;max-width:1240px;margin:0 auto;padding-inline:24px;padding-block:28px 80px}
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;max-height:100vh;overflow:auto;padding-block:4px 24px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.02em;text-decoration:none;color:var(--fg)}
.brand .logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#4f8cff,#9b5cff);display:grid;place-items:center;color:#fff;font-size:14px;font-weight:800}
.brand .b{color:var(--muted);font-weight:500}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 22px}
.chip{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface);white-space:nowrap}
.chip.ver{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
nav.toc ol{list-style:none;margin:0;padding:0;counter-reset:d}
nav.toc>details>ol>li{margin:2px 0 10px}
nav.toc a{text-decoration:none;color:var(--muted);display:block;padding:3px 8px;border-radius:6px;font-size:13.5px;line-height:1.4}
nav.toc a:hover{color:var(--fg);background:var(--sunk)}
nav.toc a.top{color:var(--fg);font-weight:600;font-size:14px}
nav.toc a.on{color:var(--accent);background:var(--accent-soft)}
nav.toc ul{list-style:none;margin:2px 0 0;padding:0 0 0 10px;border-left:1px solid var(--line);margin-left:8px}
nav.toc summary{list-style:none;cursor:pointer;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px}
nav.toc summary::-webkit-details-marker{display:none}

main{min-width:0;max-width:900px}
.doc{padding-bottom:28px;margin-bottom:40px;border-bottom:1px solid var(--line)}
.doc:last-child{border-bottom:0}
h1,h2,h3,h4{text-wrap:balance;letter-spacing:-.015em;line-height:1.25}
h1{font-size:30px;margin:8px 0 6px;font-weight:750}
h1+p{font-size:17px;color:var(--muted);margin-top:0}
h2{font-size:21px;margin:38px 0 10px;padding-top:6px;font-weight:700}
h3{font-size:16.5px;margin:28px 0 8px;font-weight:650}
h4{font-size:14px;margin:20px 0 6px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
p,li{max-width:70ch}
ul,ol{padding-left:22px}
li{margin:3px 0}
blockquote{margin:16px 0;padding:10px 16px;border-left:3px solid var(--violet);background:var(--sunk);border-radius:0 var(--radius) var(--radius) 0;color:var(--fg)}
blockquote p{margin:4px 0}
hr{border:0;border-top:1px solid var(--line);margin:28px 0}
.tbl{overflow-x:auto;margin:14px 0;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;vertical-align:top;padding:8px 12px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk)}
td code{white-space:nowrap}
pre.mermaid{background:var(--surface);text-align:center;font-family:var(--ui);padding:16px 8px}
pre.mermaid svg{max-width:100%;height:auto}

/* API reference */
.api-ref h3{font-size:19px;margin-top:40px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.lede{color:var(--muted)}
.op{margin:22px 0 30px}
.op-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.verb{font:700 11.5px/1 var(--mono);letter-spacing:.04em;padding:5px 7px;border-radius:6px;border:1px solid currentColor;min-width:58px;text-align:center}
.verb.get{color:var(--get)} .verb.post{color:var(--post)} .verb.patch{color:var(--patch)} .verb.delete{color:var(--delete)}
.path{font-size:15px;background:none!important;border:0!important;padding:0!important;font-weight:600;overflow-wrap:anywhere}
.anchor{color:var(--muted);text-decoration:none;opacity:0;font-size:14px}
.op:hover .anchor,.anchor:focus-visible{opacity:1}
.op-sum{margin:6px 0 4px;font-weight:550}
.op-desc p{margin:6px 0;color:var(--fg)}
.lbl{font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:14px 0 4px}
.lbl .ctype{text-transform:none;letter-spacing:0;font-family:var(--mono);font-weight:400;font-size:12px}
.lbl .code{font-family:var(--mono);letter-spacing:0;padding:1px 6px;border-radius:5px;border:1px solid var(--line);color:var(--fg)}
.lbl .c2{color:var(--get);border-color:currentColor} .lbl .c4,.lbl .c5{color:var(--delete);border-color:currentColor}
.req{font-size:10.5px;color:var(--delete);margin-left:6px;letter-spacing:.04em;text-transform:uppercase}
td.typ{color:var(--muted);font-size:13px}
pre.ex{max-height:340px}

.callout{display:grid;gap:4px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);margin:18px 0}
.foot{color:var(--muted);font-size:13px;margin-top:40px}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr);gap:8px;padding-inline:16px;padding-block:18px 60px}
  .rail{position:static;max-height:none;overflow:visible;padding-bottom:0}
  nav.toc summary{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);margin:0}
  nav.toc summary::after{content:" ▾"}
  nav.toc details[open] summary{margin-bottom:10px}
  h1{font-size:25px}
}
</style>
<!--BODY-->
<div class="shell">
  <aside class="rail">
    <a class="brand" href="#overview"><span class="logo">p</span>picgen <span class="b">studio</span></a>
    <div class="meta"><span class="chip ver">v{{VERSION}}</span><span class="chip">{{ENDPOINTS}} endpoints</span><span class="chip">built {{BUILT}}</span></div>
    <nav class="toc" aria-label="Contents"><details id="toc" open><summary>Contents</summary><ol>{{NAV}}</ol></details></nav>
  </aside>
  <main id="main">
    {{CONTENT}}
    <p class="foot">picgen studio documentation · v{{VERSION}} · built {{BUILT}} from <code>docs/*.md</code> and <code>docs/openapi.json</code> with <code>tools/build_docs.py</code>.</p>
  </main>
</div>
<script>
(function(){
  var mq = matchMedia('(max-width:900px)'), d = document.getElementById('toc');
  function fit(){ if (mq.matches) d.removeAttribute('open'); else d.setAttribute('open',''); }
  fit(); mq.addEventListener ? mq.addEventListener('change', fit) : mq.addListener(fit);
  d.addEventListener('click', function(e){ if (e.target.tagName === 'A' && mq.matches) d.removeAttribute('open'); });
  var links = {}; document.querySelectorAll('nav.toc a').forEach(function(a){ links[a.getAttribute('href').slice(1)] = a; });
  if (!('IntersectionObserver' in window)) return;
  var cur = null;
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if (!en.isIntersecting) return;
      var a = links[en.target.id]; if (!a) return;
      if (cur) cur.classList.remove('on'); a.classList.add('on'); cur = a;
    });
  }, {rootMargin:'0px 0px -75% 0px'});
  document.querySelectorAll('main h1[id], main h2[id]').forEach(function(h){ if (links[h.id]) io.observe(h); });
})();
</script>
