<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>picgen API explorer</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui.css">
<style>
  body{margin:0;background:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px;background:#0f1115;color:#e8e8ea}
  .bar .logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#4f8cff,#9b5cff);display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
  .bar b{font-size:16px;letter-spacing:-.02em}.bar span{color:#8b90a0;font-size:13px}
  .bar a{color:#8fb4ff;font-size:13.5px;text-decoration:none;margin-left:auto}
  .bar a+a{margin-left:0}
  .swagger-ui .topbar{display:none}
</style></head>
<body>
<div class="bar"><div class="logo">p</div><b>picgen API explorer</b><span>Try every endpoint against this server. Requests are real: POST and DELETE change data and use the GPU.</span>
  <a href="/docs">Documentation</a><a href="/api/openapi.json">openapi.json</a><a href="/">Studio</a></div>
<div id="ui"></div>
<script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
<script>
  SwaggerUIBundle({url: "/api/openapi.json", dom_id: "#ui", deepLinking: true, docExpansion: "none",
                   defaultModelsExpandDepth: 0, tryItOutEnabled: false, displayRequestDuration: true});
</script>
</body></html>
